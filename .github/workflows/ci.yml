name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.1'

jobs:
  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  database:
    name: Migrations and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onelineflow
          POSTGRES_PASSWORD: onelineflow
          POSTGRES_DB: onelineflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onelineflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "== $f"
            PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # This is the security-critical gate. RLS that is enabled but ineffective
      # looks identical to RLS that works, right up until a tenant sees another
      # tenant's ledger. The assertions run as a NON-SUPERUSER role, because a
      # superuser bypasses RLS unconditionally and would pass while proving
      # nothing.
      - name: Verify tenant isolation
        run: |
          PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow -q -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='onelineflow_app_test') THEN
                 CREATE ROLE onelineflow_app_test LOGIN PASSWORD 'test' IN ROLE onelineflow_app;
               END IF;
             END \$\$;"
          PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow \
            -v ON_ERROR_STOP=1 -f db/verify_rls.sql

      - name: Assert migrations are idempotent
        run: |
          # Re-running must be a no-op. A migration that only works on a clean
          # database will fail on the second replica during a rolling deploy.
          PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname='public'" | tee /tmp/before
          PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow -q -c \
            "SELECT ensure_monthly_partitions('invoices',1,3);"
          PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow -q -c \
            "SELECT ensure_monthly_partitions('invoices',1,3);"

  integration:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onelineflow
          POSTGRES_PASSWORD: onelineflow
          POSTGRES_DB: onelineflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onelineflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: onelineflow
          MINIO_ROOT_PASSWORD: onelineflow-dev-secret
          MINIO_DEFAULT_BUCKETS: onelineflow-documents
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            PGPASSWORD=onelineflow psql -h localhost -U onelineflow -d onelineflow \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Exercises the pieces unit tests cannot: a committed outbox row becoming a
      # real BullMQ job, redelivery NOT producing a duplicate, and bytes
      # round-tripping through object storage.
      - name: Smoke test
        env:
          DATABASE_URL: postgres://onelineflow:onelineflow@localhost:5432/onelineflow
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET_DOCUMENTS: onelineflow-documents
          S3_ACCESS_KEY_ID: onelineflow
          S3_SECRET_ACCESS_KEY: onelineflow-dev-secret
          S3_FORCE_PATH_STYLE: 'true'
          ENCRYPTION_ROOT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QBO_CLIENT_ID: ci
          QBO_CLIENT_SECRET: ci
          QBO_REDIRECT_URI: http://localhost:3000/v1/qbo/callback
          GOOGLE_AI_API_KEY: ci
        run: pnpm smoke

      # Real-database races: the CAS claim, the dedup-key claim, and the
      # guarantee that a failed request never returns a tenant-tainted
      # connection to the pool. None of these can be tested with mocks.
      - name: Concurrency and recovery smoke
        env:
          DATABASE_URL: postgres://onelineflow:onelineflow@localhost:5432/onelineflow
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET_DOCUMENTS: onelineflow-documents
          S3_ACCESS_KEY_ID: onelineflow
          S3_SECRET_ACCESS_KEY: onelineflow-dev-secret
          ENCRYPTION_ROOT_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          QBO_CLIENT_ID: ci
          QBO_CLIENT_SECRET: ci
          QBO_REDIRECT_URI: http://localhost:3000/v1/qbo/callback
          GOOGLE_AI_API_KEY: ci
        run: pnpm smoke:concurrency

  python:
    name: Python reconciler
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: python/reconciler }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy onelineflow_recon
      # Includes the cross-language crypto interop suite, which opens boxes
      # sealed by the real Node implementation. Drift between the two would
      # otherwise surface as "the reconciler cannot read any tenant's token".
      - run: pytest -q
