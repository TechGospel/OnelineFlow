apiVersion: v1
kind: Service
metadata:
  name: {{ include "onelineflow.fullname" . }}-api
  labels:
    {{- include "onelineflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: {{ .Values.config.METRICS_PORT | int }}
      targetPort: metrics
  selector:
    app.kubernetes.io/name: {{ include "onelineflow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onelineflow.fullname" . }}
  labels: {{- include "onelineflow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $svc := list "api" "relay" "extraction" "posting" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "onelineflow.fullname" $ }}-{{ $svc }}
  labels: {{- include "onelineflow.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "onelineflow.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $svc }}
{{- end }}
{{- end }}
