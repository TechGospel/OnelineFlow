# Default values. Everything here is overridable per environment.
#
# The deployment model, and why:
#
#   api        — stateless, scales on CPU. Never does slow work.
#   relay      — SMALL replica count. It is the single path all work flows
#                through, but FOR UPDATE SKIP LOCKED means replicas share the
#                load cleanly. Two is enough for availability; more just adds
#                idle pollers.
#   extraction — scales on QUEUE DEPTH, not CPU. It spends its life awaiting
#                model responses, so CPU stays near zero while the backlog
#                grows. A CPU-based HPA would never scale it up.
#   posting    — also queue-depth scaled, but capped much lower. QuickBooks
#                rate-limits per realm, so past a point extra pods just contend
#                for the same token bucket.
#   scheduler  — EXACTLY ONE. Every task is idempotent so a second is harmless,
#                but pointless. Alert on its heartbeat instead.

image:
  repository: ghcr.io/techgospel/onelineflow
  tag: '' # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# Values that are NOT secrets. Secrets come from existingSecret below.
config:
  NODE_ENV: production
  LOG_LEVEL: info
  QBO_ENVIRONMENT: production
  QBO_MINOR_VERSION: '75'
  QBO_RATE_LIMIT_PER_MIN: '450'
  QBO_MAX_CONCURRENT_PER_REALM: '8'
  AI_AUTOPOST_CONFIDENCE_THRESHOLD: '0.95'
  AI_CONSENSUS_TRIGGER_THRESHOLD: '0.98'
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'false'
  S3_SERVER_SIDE_ENCRYPTION: AES256
  METRICS_PORT: '9464'

# The chart NEVER templates secret values. Create this Secret out of band
# (sealed-secrets, External Secrets, SOPS) with these keys:
#   DATABASE_URL, DATABASE_REPLICA_URL, REDIS_URL,
#   ENCRYPTION_ROOT_KEY, QBO_CLIENT_ID, QBO_CLIENT_SECRET, QBO_REDIRECT_URI,
#   QBO_WEBHOOK_VERIFIER_TOKEN, OPENAI_API_KEY, GOOGLE_AI_API_KEY,
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET_DOCUMENTS,
#   JWT_PUBLIC_KEY or JWT_JWKS
existingSecret: onelineflow-secrets

serviceAccount:
  create: true
  annotations: {}

# Applied to every pod. Non-root, read-only root filesystem, no privilege
# escalation — the service writes only to Postgres and object storage.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ['ALL'] }

# --- Migrations -------------------------------------------------------------
# Runs as a pre-install/pre-upgrade hook. The runner takes a Postgres advisory
# lock, so concurrent hook runs during a rolling deploy block rather than race.
migrations:
  enabled: true
  backoffLimit: 3

services:
  api:
    replicas: 3
    port: 3000
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 30
      targetCPUUtilizationPercentage: 70

  relay:
    replicas: 2
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }

  extraction:
    replicas: 4
    concurrency: 25
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    keda:
      enabled: true
      minReplicas: 2
      maxReplicas: 100
      # Scale so each pod carries ~100 waiting jobs. Extraction is IO-bound on
      # model latency, so a pod handles far more concurrency than its CPU
      # request implies.
      listLength: '100'

  posting:
    replicas: 3
    concurrency: 10
    resources:
      requests: { cpu: 150m, memory: 512Mi }
      limits: { memory: 1Gi }
    keda:
      enabled: true
      minReplicas: 2
      # Capped far below extraction: QuickBooks rate-limits per realm, so extra
      # pods past this point only contend for the same token bucket.
      maxReplicas: 20
      listLength: '50'

  scheduler:
    # Deliberately not configurable. See the header comment.
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 512Mi }

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

serviceMonitor:
  enabled: true
  interval: 30s

# Keep the pipeline alive through a node drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
