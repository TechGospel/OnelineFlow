[project]
name = "onelineflow-recon"
version = "0.1.0"
description = "Nightly reconciliation between onelineFlow and QuickBooks Online"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.14",
]

[project.scripts]
onelineflow-recon = "onelineflow_recon.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onelineflow_recon*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "S"]
# S101 (assert) is the point of a test file; ANN in tests is noise.
per-file-ignores = { "tests/*" = ["S101", "ANN"] }

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
